<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>年表 · 兰台</title>
    <meta name="description" content="兰台以时间为骨架，浏览中国历史人物与事件。" />
    <meta name="theme-color" content="#101c2c" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./images/apple-touch-icon.png" />
    <link rel="canonical" href="https://history.0xenzyme.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="历史时间轴" />
    <meta property="og:description" content="兰台以时间为骨架，浏览中国历史人物与事件。" />
    <meta property="og:url" content="https://history.0xenzyme.dev/" />
    <meta property="og:image" content="https://history.0xenzyme.dev/images/history-timeline.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://history.0xenzyme.dev/images/history-timeline.png" />
  </head>
  <body class="skin-voyage">
    <div id="app"></div>
    <div id="nebula" aria-hidden="true"></div>
    <canvas id="stars" aria-hidden="true"></canvas>

    <div class="boot" id="boot">正在载入数据…</div>
    <div class="boot is-error" id="boot-error" hidden></div>

    <noscript>
      <div class="boot">
        <h1>历史时间轴</h1>
        <p>兰台以时间为骨架，把中国历史人物与事件放在同一套年代坐标中。年表支持专题切换、缩放、检索和实体预览。</p>
        <p>本站的缩放、搜索与详情卡需要启用 JavaScript。当前浏览器已禁用 JavaScript，只能看到这段说明。</p>
      </div>
    </noscript>

    <a class="lt-skip-link" href="#timeline-tools">跳到年表工具</a>
    <main id="main-content">
      <div id="stage">
        <canvas
          id="chart"
          tabindex="0"
          role="img"
          aria-label="历史时间轴。使用左右方向键平移，加减键缩放；也可打开当前时间窗实体列表选择对象。"
          aria-describedby="timeline-description"
        ></canvas>
      </div>
    </main>
    <p class="sr-only" id="timeline-description">
      人物与事件共用时间坐标。当前时间窗实体列表提供不依赖指针的选择入口。
    </p>
    <details class="timeline-accessible-entities" id="timeline-accessible-entities">
      <summary>当前时间窗实体</summary>
      <ul id="timeline-entity-list"></ul>
    </details>

    <header class="topbar" id="topbar">
      <div class="island">
        <a class="brand" href="/timeline" aria-label="兰台年表">兰台</a>
        <nav class="line-tabs" aria-label="内容线">
          <button type="button" class="line-btn active" data-line="people">人物</button>
          <button type="button" class="line-btn" data-line="military">军事</button>
          <button type="button" class="line-btn" data-line="history">历史事件</button>
        </nav>
        <span class="divider"></span>
        <label class="sr-only" for="topic-select">朝代 / 主题</label>
        <select class="topic-select" id="topic-select" title="选择要浏览的朝代或主题"></select>
        <div class="search" id="timeline-tools">
          <label class="sr-only" for="search">搜索人物或事件</label>
          <input
            class="search-input"
            id="search"
            type="search"
            placeholder="搜索人物 / 事件"
            autocomplete="off"
            role="combobox"
            aria-expanded="false"
            aria-controls="search-results"
          />
          <div class="search-results" id="search-results" role="listbox" aria-label="搜索结果" hidden></div>
        </div>
        <span class="divider"></span>
        <button
          type="button"
          class="tool"
          id="btn-lanes"
          aria-haspopup="true"
          aria-expanded="false"
          title="选择当前视图要显示的人物或事件分类"
        >
          分类
        </button>
        <button type="button" class="tool" id="btn-reset" title="回到当前视图的全览位置">复位</button>
        <div class="export-wrap">
          <button
            type="button"
            class="tool"
            id="btn-export"
            aria-haspopup="true"
            aria-expanded="false"
            title="把当前视图导出为 PNG 或 SVG 图片"
          >
            导出
          </button>
          <div class="export-menu" id="export-menu" hidden>
            <button type="button" data-export="png">导出 PNG</button>
            <button type="button" data-export="svg">导出 SVG</button>
          </div>
        </div>
        <span class="divider"></span>
        <div class="skin-switch" role="group" aria-label="主题">
          <button type="button" id="skin-voyage" class="on" title="主题：纸本巡航配色">巡航</button>
          <button type="button" id="skin-deepspace" title="主题：深空星空配色">深空</button>
        </div>
      </div>

      <div class="chips" id="chips" role="group" aria-label="快捷筛选">
        <button type="button" class="chip on" data-filter="all" title="显示全部条目">全部</button>
        <button type="button" class="chip" data-filter="military" title="只高亮战事类事件">战事</button>
        <button type="button" class="chip" data-filter="political" title="只高亮朝政类事件">朝政</button>
        <button type="button" class="chip" data-filter="cultural" title="只高亮文化类事件">文化</button>
        <button type="button" class="chip" data-filter="female" title="只高亮女性人物（仅人物线可用）">女性</button>
      </div>
    </header>

    <button type="button" class="strip-toggle" id="strip-toggle" aria-expanded="false" title="展开或收起底部事件条">
      事件条 ▾
    </button>

    <div class="lane-panel" id="lane-panel">
      <div class="lane-panel-head">
        <span>显示分类</span>
        <button type="button" id="lanes-all">全选</button>
        <button type="button" id="lanes-none">清空</button>
      </div>
      <div id="lane-list"></div>
      <div id="lane-chapters"></div>
    </div>

    <p class="hint" id="hint">滚轮缩放 · 拖动平移 · 点击人物或事件 · 底部朝代带可跳转</p>

    <aside class="card" id="card" aria-live="polite" aria-label="详情">
      <button type="button" class="card-close" id="card-close" aria-label="关闭详情">×</button>
      <div id="card-body"></div>
    </aside>

    <div class="ribbon">
      <canvas id="ribbon-canvas" aria-hidden="true"></canvas>
    </div>

    <div class="tooltip" id="tooltip" role="status" hidden></div>
    <div class="sr-only" id="status" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
