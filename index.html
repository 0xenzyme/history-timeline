<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>历史时间轴</title>
    <meta name="description" content="四千年中国历史人物与事件，同一条可缩放、可检索的时间轴。" />
    <meta name="theme-color" content="#101c2c" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="canonical" href="https://history.0xenzme.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="历史时间轴" />
    <meta property="og:description" content="四千年中国历史人物与事件，同一条可缩放、可检索的时间轴。" />
    <meta property="og:url" content="https://history.0xenzme.dev/" />
    <meta property="og:image" content="https://history.0xenzme.dev/images/history-timeline.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="skin-voyage">
    <div id="nebula" aria-hidden="true"></div>
    <canvas id="stars" aria-hidden="true"></canvas>

    <div class="boot" id="boot">正在载入数据…</div>
    <div class="boot is-error" id="boot-error" hidden></div>

    <div id="stage">
      <canvas id="chart" role="img" aria-label="历史时间轴"></canvas>
    </div>

    <header class="topbar" id="topbar">
      <div class="island">
        <span class="brand">历史时间轴</span>
        <nav class="line-tabs" aria-label="内容线">
          <button type="button" class="line-btn active" data-line="people">人物</button>
          <button type="button" class="line-btn" data-line="military">军事</button>
          <button type="button" class="line-btn" data-line="history">历史事件</button>
        </nav>
        <span class="divider"></span>
        <label class="sr-only" for="topic-select">专题</label>
        <select class="topic-select" id="topic-select"></select>
        <span class="divider"></span>
        <div class="search">
          <label class="sr-only" for="search">搜索人物或事件</label>
          <input
            class="search-input"
            id="search"
            type="search"
            placeholder="搜索人物 / 事件"
            autocomplete="off"
            role="combobox"
            aria-expanded="false"
            aria-controls="search-results"
          />
          <div class="search-results" id="search-results" role="listbox" aria-label="搜索结果" hidden></div>
        </div>
        <span class="divider"></span>
        <button type="button" class="tool" id="btn-lanes" aria-haspopup="true" aria-expanded="false">泳道</button>
        <button type="button" class="tool" id="btn-reset">复位</button>
        <div class="export-wrap">
          <button type="button" class="tool" id="btn-export" aria-haspopup="true" aria-expanded="false">导出</button>
          <div class="export-menu" id="export-menu" hidden>
            <button type="button" data-export="png">导出 PNG</button>
            <button type="button" data-export="svg">导出 SVG</button>
          </div>
        </div>
        <span class="divider"></span>
        <div class="skin-switch" role="group" aria-label="皮肤">
          <button type="button" id="skin-voyage" class="on">巡航</button>
          <button type="button" id="skin-deepspace">深空</button>
        </div>
      </div>

      <div class="chips" id="chips" role="group" aria-label="快捷筛选">
        <button type="button" class="chip on" data-filter="all">全部</button>
        <button type="button" class="chip" data-filter="military">战事</button>
        <button type="button" class="chip" data-filter="political">朝政</button>
        <button type="button" class="chip" data-filter="cultural">文化</button>
        <button type="button" class="chip" data-filter="female">女性</button>
      </div>
    </header>

    <button type="button" class="strip-toggle" id="strip-toggle" aria-expanded="false">事件条 ▾</button>

    <div class="lane-panel" id="lane-panel">
      <div class="lane-panel-head">
        <span>显示泳道</span>
        <button type="button" id="lanes-all">全选</button>
        <button type="button" id="lanes-none">清空</button>
      </div>
      <div id="lane-list"></div>
      <div id="lane-chapters"></div>
    </div>

    <p class="hint" id="hint">滚轮缩放 · 拖动平移 · 点击人物或事件 · 底部朝代带可跳转</p>

    <aside class="card" id="card" aria-live="polite" aria-label="详情">
      <button type="button" class="card-close" id="card-close" aria-label="关闭详情">×</button>
      <div id="card-body"></div>
    </aside>

    <div class="ribbon">
      <canvas id="ribbon-canvas" aria-hidden="true"></canvas>
    </div>

    <div class="tooltip" id="tooltip" role="status" hidden></div>
    <div class="sr-only" id="status" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
