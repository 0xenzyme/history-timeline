<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>年表 · 兰台</title>
    <meta name="description" content="兰台以时间为骨架，浏览中国历史人物与事件。" />
    <meta name="theme-color" content="#261a14" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./images/apple-touch-icon.png" />
    <link rel="canonical" href="https://history.0xenzyme.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="历史时间轴" />
    <meta property="og:description" content="兰台以时间为骨架，浏览中国历史人物与事件。" />
    <meta property="og:url" content="https://history.0xenzyme.dev/" />
    <meta property="og:image" content="https://history.0xenzyme.dev/images/history-timeline.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://history.0xenzyme.dev/images/history-timeline.png" />
  </head>
  <body class="skin-voyage">
    <div id="app"></div>
    <div id="nebula" aria-hidden="true"></div>
    <canvas id="stars" aria-hidden="true"></canvas>

    <div class="boot" id="boot">正在载入数据…</div>
    <div class="boot is-error" id="boot-error" hidden></div>

    <noscript>
      <div class="boot">
        <h1>历史时间轴</h1>
        <p>兰台以时间为骨架，把中国历史人物与事件放在同一套年代坐标中。年表支持专题切换、缩放、检索和实体预览。</p>
        <p>本站的缩放、搜索与详情卡需要启用 JavaScript。当前浏览器已禁用 JavaScript，只能看到这段说明。</p>
      </div>
    </noscript>

    <!-- 全站共享顶栏：与内容页同一个 renderSiteHeader，由 main.ts 注入。 -->
    <div id="site-header-mount" data-timeline-only></div>

    <!-- 02 基准：山水 banner + 页面操作。 -->
    <header class="lt-timeline-hero" data-timeline-only>
      <img
        class="lt-page-banner-art"
        src="/media/banners/banner-timeline-1440.webp"
        srcset="
          /media/banners/banner-timeline-768.webp   768w,
          /media/banners/banner-timeline-1440.webp 1440w,
          /media/banners/banner-timeline-2000.webp 2000w
        "
        sizes="100vw"
        width="2400"
        height="800"
        alt=""
        aria-hidden="true"
        fetchpriority="high"
        decoding="async"
      />
      <div class="lt-timeline-hero-inner">
        <div class="lt-timeline-hero-text">
          <h1>年表</h1>
          <p>中国历史年表 · 以人物、战事、事件贯通时代脉络</p>
        </div>
        <div class="lt-timeline-hero-actions">
          <button type="button" class="lt-hero-button" data-export="png">导出 PNG</button>
          <button type="button" class="lt-hero-button" data-export="svg">导出 SVG</button>
        </div>
      </div>
    </header>

    <a class="lt-skip-link" href="#timeline-tools" data-timeline-only>跳到年表工具</a>

    <div class="lt-workspace" data-timeline-only>
      <!-- 左栏：分类与筛选（02 深木固定栏）。 -->
      <aside class="lt-timeline-filters" id="lane-panel" aria-label="年表分类与筛选">
        <div id="timeline-tools">
          <div class="search lt-timeline-search" id="timeline-search-box">
            <label class="sr-only" for="search">搜索人物或事件</label>
            <input
              class="search-input"
              id="search"
              type="search"
              placeholder="搜索当前年表…"
              autocomplete="off"
              role="combobox"
              aria-expanded="false"
              aria-controls="search-results"
            />
            <div class="search-results" id="search-results" role="listbox" aria-label="搜索结果" hidden></div>
          </div>

          <section class="lt-filter-group" aria-labelledby="filter-groups-title">
            <h2 id="filter-groups-title">分类</h2>
            <label class="lt-filter-check"
              ><input type="checkbox" data-group="people" checked /> <span>人物</span></label
            >
            <label class="lt-filter-check"><input type="checkbox" data-group="war" checked /> <span>战事</span></label>
            <label class="lt-filter-check"
              ><input type="checkbox" data-group="history" checked /> <span>历史事件</span></label
            >
          </section>

          <section class="lt-filter-group" aria-labelledby="filter-lanes-title">
            <h2 id="filter-lanes-title">显示分类</h2>
            <div class="lane-panel-head">
              <button type="button" id="lanes-all">全选</button>
              <button type="button" id="lanes-none">清空</button>
            </div>
            <div id="lane-list"></div>
          </section>

          <div class="chips lt-filter-group" id="chips" role="group" aria-label="快捷筛选">
            <h2>快捷筛选</h2>
            <div class="lt-chip-row">
              <button type="button" class="chip on" data-filter="all" title="显示全部条目">全部</button>
              <button type="button" class="chip" data-filter="military" title="只高亮战事类事件">战事</button>
              <button type="button" class="chip" data-filter="political" title="只高亮朝政类事件">朝政</button>
              <button type="button" class="chip" data-filter="cultural" title="只高亮文化类事件">文化</button>
              <button type="button" class="chip" data-filter="female" title="只高亮女性人物（仅人物线可用）">
                女性
              </button>
            </div>
          </div>

          <div id="lane-chapters"></div>

          <label class="lt-topic-select-label" for="topic-select">朝代 / 主题</label>
          <select class="topic-select" id="topic-select" title="选择要浏览的朝代或主题"></select>

          <button type="button" class="lt-filter-reset" id="btn-reset-filters">重置筛选</button>
        </div>
      </aside>

      <!-- 中央：朝代场景头 + 画布 + 图例与缩放。 -->
      <main id="main-content" class="lt-timeline-center">
        <div class="lt-dynasty-head">
          <button type="button" class="lt-filter-toggle" id="btn-filter-toggle" aria-label="打开分类与筛选">
            筛选
          </button>
          <button type="button" class="lt-dynasty-arrow" id="topic-prev" aria-label="上一个专题">‹</button>
          <div class="lt-dynasty-head-text" id="topic-head" aria-live="polite"></div>
          <button type="button" class="lt-dynasty-arrow" id="topic-next" aria-label="下一个专题">›</button>
        </div>
        <div id="stage">
          <canvas
            id="chart"
            tabindex="0"
            role="img"
            aria-label="历史时间轴。使用左右方向键平移，加减键缩放；也可打开当前时间窗实体列表选择对象。"
            aria-describedby="timeline-description"
          ></canvas>
        </div>
        <div class="lt-timeline-statusbar">
          <div class="lt-legend" aria-label="图例">
            <span class="lt-legend-item"><i class="lt-legend-life"></i>人物生平</span>
            <span class="lt-legend-item"><i class="lt-legend-war"></i>战事</span>
            <span class="lt-legend-item"><i class="lt-legend-history"></i>历史事件</span>
          </div>
          <p class="hint" id="hint">滚轮缩放 · 拖动平移 · 点击人物或事件</p>
          <div class="lt-zoom" role="group" aria-label="视图控制">
            <button type="button" class="tool" id="btn-reset" title="回到当前视图的全览位置">复位</button>
            <button type="button" class="tool" id="zoom-out" aria-label="缩小">−</button>
            <span class="lt-zoom-level" id="zoom-level" aria-live="off">100%</span>
            <button type="button" class="tool" id="zoom-in" aria-label="放大">+</button>
          </div>
        </div>
        <details class="timeline-accessible-entities" id="timeline-accessible-entities">
          <summary>当前时间窗实体</summary>
          <ul id="timeline-entity-list"></ul>
        </details>
      </main>

      <!-- 右栏：详情预览（02 固定栏，不覆盖画布）。 -->
      <aside class="card lt-timeline-detail" id="card" aria-live="polite" aria-label="详情">
        <button type="button" class="card-close" id="card-close" aria-label="关闭详情">×</button>
        <div id="card-body"></div>
        <p class="lt-detail-empty" id="detail-empty">选择人物或事件，在这里查看预览。</p>
      </aside>
    </div>

    <!-- 02 基准：底部深木朝代导航条。 -->
    <nav class="lt-dynasty-band" id="dynasty-band" data-timeline-only aria-label="朝代导航">
      <button type="button" class="lt-dynasty-arrow" id="dynasty-prev" aria-label="向左滚动朝代">‹</button>
      <div class="lt-dynasty-track" id="dynasty-track"></div>
      <button type="button" class="lt-dynasty-arrow" id="dynasty-next" aria-label="向右滚动朝代">›</button>
    </nav>

    <p class="sr-only" id="timeline-description" data-timeline-only>
      人物与事件共用时间坐标。当前时间窗实体列表提供不依赖指针的选择入口。
    </p>

    <!-- 旧版控件保留在隐藏容器：运行时引用与深链兼容不删逻辑。 -->
    <div class="lt-legacy-controls" data-timeline-only hidden aria-hidden="true">
      <header class="topbar" id="topbar">
        <nav class="line-tabs" aria-label="内容线">
          <button type="button" class="line-btn active" data-line="people">人物</button>
          <button type="button" class="line-btn" data-line="military">军事</button>
          <button type="button" class="line-btn" data-line="history">历史事件</button>
        </nav>
        <button type="button" class="tool" id="btn-lanes">分类</button>
        <button type="button" class="tool" id="btn-export">导出</button>
        <div class="export-menu" id="export-menu" hidden>
          <button type="button" data-export="png">导出 PNG</button>
          <button type="button" data-export="svg">导出 SVG</button>
        </div>
        <div class="skin-switch" role="group" aria-label="主题">
          <button type="button" id="skin-voyage" class="on" title="主题：纸本巡航配色">巡航</button>
          <button type="button" id="skin-deepspace" title="主题：深空星空配色">深空</button>
        </div>
      </header>
      <button type="button" class="strip-toggle" id="strip-toggle" aria-expanded="false">事件条 ▾</button>
      <div class="ribbon"><canvas id="ribbon-canvas" aria-hidden="true"></canvas></div>
    </div>

    <div class="tooltip" id="tooltip" data-timeline-only role="status" hidden></div>
    <div class="sr-only" id="status" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
