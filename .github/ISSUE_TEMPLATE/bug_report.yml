name: 功能问题
description: 报告界面、交互或构建问题
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题说明
      description: 说明实际结果与预期结果。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: "1. 打开页面\n2. 切换内容线\n3. ..."
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 相关 URL
      description: 如果问题与特定专题或事件有关，请提供完整链接。
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: Windows 11 / Chrome 版本
    validations:
      required: true
